# 团队成员
# 照片放在 static/images/people/ 下，photo 填文件名（建议正方形、宽 400px 左右）；没有照片就留空。

pi:
  name: { zh: "[PI 姓名]", en: "[PI Name]" }
  title: { zh: 课题组负责人 · 研究员, en: Principal Investigator · Professor }
  bio:
    zh: "[示例简介] 博士毕业于 [院校]，曾在 [机构] 从事博士后研究，研究兴趣包括合成生物学、单细胞基因组学与细胞动态。"
    en: "[Sample bio] PhD from [University], postdoctoral training at [Institute]. Interests span synthetic biology, single-cell genomics and cellular dynamics."
  email: "[pi@example.edu.cn]"
  office: { zh: "[楼号 / 房间]", en: "[Building / Room]" }
  photo: ""
  links: []
  #  - { label: Google Scholar, url: "https://scholar.google.com/..." }
  #  - { label: ORCID, url: "https://orcid.org/..." }

# 分组及显示顺序。成员毕业时，只需把他的 group 改成 alumni。
groups:
  - id: staff
    title: { zh: 博士后与研究人员, en: Postdocs & Staff }
  - id: students
    title: { zh: 研究生, en: Graduate Students }
  - id: alumni
    title: { zh: 已毕业成员, en: Alumni }

# 成员列表。同一组内按这里的先后顺序显示。
members:
