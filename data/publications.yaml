# 论文发表
# authors 中用 **粗体** 标出本组成员，* 表示通讯作者，# 表示共同一作。
# tags 取自下方 tags 列表的 id，用于页面上的筛选按钮。
# sample: true 会显示“示例”标记，换成真实论文后删掉这一行。
# 链接（doi / pdf / code）都可以省略。

tags:
  - { id: method, label: { zh: 方法开发, en: Methods } }
  - { id: synbio, label: { zh: 合成生物学, en: Synthetic biology } }
  - { id: sc, label: { zh: 单细胞, en: Single-cell } }
  - { id: review, label: { zh: 综述, en: Review } }

